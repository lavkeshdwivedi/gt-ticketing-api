# Local development only. Runs SQL Server and the API with development auth enabled.
# The SA password below is a throwaway for a local container, not a secret.
services:
  sql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "Local_Dev_Only_P@ssw0rd"
    ports:
      - "1433:1433"
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s

  api:
    build: .
    depends_on:
      sql:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Ticketing: "Server=sql,1433;Database=Ticketing;User Id=sa;Password=Local_Dev_Only_P@ssw0rd;TrustServerCertificate=true;Encrypt=true"
      # The load test turns this off so it measures the database path, not the per-user throttle.
      RateLimiting__Purchases__Enabled: "${PURCHASE_RATE_LIMIT_ENABLED:-true}"
    ports:
      - "8080:8080"
